# --- Global Localization Parameters ---
global_localization:
  ros__parameters:
    map_voxel_size: 0.25
    scan_voxel_size: 0.1
    freq_localization: 0.2
    localization_threshold: 0.8
    fov: 6.28319
    fov_far: 50.0
    max_jump_distance: 1.5       # Maximum allowable position jump in meters
    odom_topic: /odometry/fast_lio

transform_fusion:
  ros__parameters:
    odom_frame_id: odom
    base_frame_id: base_footprint
    lidar_frame_id: livox_frame
    camera_init_frame_id: camera_init
    body_frame_id: body
    odom_topic: /odometry/fast_lio

map_publisher:
  ros__parameters:
    tf_frame: map
    interval: 30.0 # seconds

# --- FAST-LIO Mapping Parameters ---
fast_lio_mapping:
  ros__parameters:
    feature_extract_enable: false
    point_filter_num: 3
    max_iteration: 10
    filter_size_surf: 0.5
    filter_size_map: 0.5
    cube_side_length: 2500.0
    runtime_pos_log_enable: false
    map_file_path: ""

    common:
      lid_topic: "/livox/lidar"
      imu_topic: "/livox/imu"
      time_sync_en: false         # ONLY turn on when external time synchronization is really not possible
      time_offset_lidar_to_imu: 0.0 

    preprocess:
      lidar_type: 5                # 5 for generic XYZ/XYZI handler
      scan_line:  4
      blind: 0.5
      timestamp_unit: 3
      scan_rate: 10

    mapping:
      acc_cov: 0.6
      gyr_cov: 0.4
      b_acc_cov: 0.001
      b_gyr_cov: 0.001
      fov_degree: 360.0
      det_range: 50.0
      extrinsic_est_en: true      # true: enable the online estimation of IMU-LiDAR extrinsic
      extrinsic_T: [ -0.011, -0.02329, 0.04412 ]
      extrinsic_R: [ 1., 0., 0.,
                      0., 1., 0.,
                      0., 0., 1.]

    publish:
      path_en: true                # true: publish Path
      effect_map_en: false         # true: publish Effects
      map_en: true                 # true: publish Map cloud
      scan_publish_en: true       # false: close all the point cloud output
      dense_publish_en: false      # false: low down the points number in a global-frame point clouds scan.
      scan_bodyframe_pub_en: true  # true: output the point cloud scans in IMU-body-frame

    pcd_save:
      pcd_save_en: false
      interval: -1                 # how many LiDAR frames saved in each pcd file;